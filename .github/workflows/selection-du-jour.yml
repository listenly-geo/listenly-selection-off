name: Selection du jour - 10 fiches moment (sans Search Console)
on:
  workflow_dispatch: {}
  schedule:
    # 26/11/2026 : GitHub rate parfois les crons (rien ne s'est lance le 26/11). On declenche 4 fois ; la garde ci-dessous
    # saute les passages suivants des que la liste du jour existe deja.
    - cron: '0 7 * * *'    # 08h00 Berlin en hiver (07h00 UTC) ; 09h00 Berlin en ete
    - cron: '25 7 * * *'
    - cron: '50 7 * * *'
    - cron: '30 8 * * *'
permissions:
  contents: write
concurrency:
  group: selection-du-jour
  cancel-in-progress: false
jobs:
  selection:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Garde (liste du jour deja faite ?)
        id: garde
        run: |
          d=$(python3 -c "import json;print(json.load(open('pages/podcast-btb/data/indexation_du_jour.json',encoding='utf-8')).get('date',''))")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$d" = "$(date -u +%F)" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Liste du jour deja faite ($d) : on saute ce passage"; fi
      - uses: actions/setup-python@v5
        if: steps.garde.outputs.skip != 'true'
        with:
          python-version: '3.11'
      - run: pip install -q requests
        if: steps.garde.outputs.skip != 'true'
      - name: Note des moments (avant enrichissement)
        if: steps.garde.outputs.skip != 'true'
        run: python3 automation/scripts/moteur_autonome_moments.py
      - name: Rallonger la reponse des fiches candidates
        if: steps.garde.outputs.skip != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 automation/scripts/enrichir_du_jour.py
      - name: Note des moments (apres enrichissement)
        if: steps.garde.outputs.skip != 'true'
        run: python3 automation/scripts/moteur_autonome_moments.py
      - name: Liste du jour (sans verification Search Console)
        if: steps.garde.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 automation/scripts/indexation_du_jour.py
      - name: Sauvegarde dans le depot
        if: steps.garde.outputs.skip != 'true'
        run: |
          git config user.name "selection-bot"; git config user.email "bot@listenly.fr"
          git add pages/podcast-btb/data
          git diff --cached --quiet && exit 0
          git commit -m "Selection du jour : liste des 10 fiches"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done; exit 1
